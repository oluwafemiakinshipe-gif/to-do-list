
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your tasks. Stay on time.</p>

        <form id="taskForm" class="task-form">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
                aria-label="Task name"
                required
            >

            <input
                type="date"
                id="taskDate"
                aria-label="Task date"
                required
            >

            <input
                type="time"
                id="taskTime"
                aria-label="Task start time"
                required
            >

            <button type="submit" id="addTaskBtn">Add Task</button>
        </form>

        <div class="notification-settings">
            <span id="notificationStatus">
                In-app reminders are enabled while this page is open.
            </span>
            <button type="button" id="enableNotificationsBtn">
                Enable Browser Notifications
            </button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Task</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Countdown</th>
                        <th>Task Complete</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="taskList"></tbody>
            </table>
        </div>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </main>

    <!-- Reminder popup -->
    <div
        id="reminderModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        aria-describedby="modalMessage"
        hidden
    >
        <div class="modal-content">
            <div id="modalIcon" class="modal-icon">🔔</div>
            <h2 id="modalTitle">Task Reminder!</h2>
            <p id="modalMessage"></p>
            <button type="button" id="closeModalBtn">Got it!</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
